[project]
name = "kraken"
version = "0.1.0"
description = "Kraken desktop front-end for the Pi coding agent"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "onnx-asr[cpu,hub]>=0.12.0",
    "pygments>=2.20.0",
    "pyside6>=6.11.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# The app runs from the source tree rather than being installed, so the repo
# root has to be importable for `kraken.*` regardless of how pytest is invoked.
pythonpath = ["."]

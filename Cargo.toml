[workspace]
members = ["crates/kraken-core", "crates/kraken-qt"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
kraken-core = { path = "crates/kraken-core" }
qmetaobject = "0.2"
qttypes = "0.2"
cpp = "0.5"
cpp_build = "0.5"
cstr = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
libc = "0.2"
once_cell = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["simd", "html"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
libghostty-vt = "0.2.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
